# Pull request labels driven by changed file paths.
#
# actions/labeler owns these subsystem labels with sync-labels enabled. Keep
# this vocabulary disjoint from the Conventional Commits labels managed in
# label.yml, and declare every label in labels.yml before using it here.
#
# Schema reference: https://github.com/actions/labeler

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum

parser:
  - changed-files:
      - any-glob-to-any-file:
          - parser/**

tools:
  - changed-files:
      - any-glob-to-any-file:
          - tools/**
