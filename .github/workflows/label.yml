# This workflow handles untrusted pull requests with a write-scoped token.
# Keep these invariants intact:
#   - check out and execute only the immutable base SHA;
#   - pass PR-controlled data through env/files, never into run expressions;
#   - derive labels only from ccvalidate output and hardcoded mappings;
#   - pin third-party actions to full commit SHAs.

name: label

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  file-globs:
    name: file-glob labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  cc-title:
    name: conventional-commits labels
    needs: file-globs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build trusted validator
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/ccvalidate" ./tools/ccvalidate

      - name: Sync Conventional Commits labels
        run: |
          set -euo pipefail

          managed=(
            enhancement bug performance refactor documentation
            test build ci chore breaking-change
          )
          desired=()

          message_file="$RUNNER_TEMP/pr-message.txt"
          {
            printf '%s\n' "$PR_TITLE"
            if [ -n "${PR_BODY:-}" ]; then
              printf '\n%s' "$PR_BODY"
            fi
          } > "$message_file"

          commit_type=""
          breaking=false
          if describe=$(CC_INPUT_FILE="$message_file" "$RUNNER_TEMP/ccvalidate" --describe 2>/dev/null); then
            while IFS='=' read -r key value; do
              case "$key" in
                type) commit_type="$value" ;;
                breaking) breaking="$value" ;;
              esac
            done <<< "$describe"
          else
            echo "::warning title=Non-Conventional-Commits PR title::The PR title is not a valid Conventional Commit and will not receive a category label."
          fi

          case "$commit_type" in
            feat) desired+=(enhancement) ;;
            fix) desired+=(bug) ;;
            perf) desired+=(performance) ;;
            refactor) desired+=(refactor) ;;
            docs) desired+=(documentation) ;;
            test) desired+=(test) ;;
            build) desired+=(build) ;;
            ci) desired+=(ci) ;;
            chore|style|revert) desired+=(chore) ;;
            "") ;;
            *)
              echo "unexpected type from ccvalidate: $commit_type" >&2
              exit 1
              ;;
          esac

          case "$breaking" in
            true) desired+=(breaking-change) ;;
            false) ;;
            *)
              echo "unexpected breaking value from ccvalidate: $breaking" >&2
              exit 1
              ;;
          esac

          allowed='^(enhancement|bug|performance|refactor|documentation|test|build|ci|chore|breaking-change)$'
          if [ ${#desired[@]} -gt 0 ]; then
            for label in "${desired[@]}"; do
              if [[ ! "$label" =~ $allowed ]]; then
                echo "refusing non-whitelisted label: $label" >&2
                exit 1
              fi
            done
          fi

          if ! current_raw=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' | sort -u); then
            echo "::error::Unable to read current labels; refusing to mutate unknown state."
            exit 1
          fi
          current=()
          while IFS= read -r label; do
            [ -n "$label" ] && current+=("$label")
          done <<< "$current_raw"

          contains() {
            local needle="$1"
            shift
            local candidate
            for candidate in "$@"; do
              [ "$candidate" = "$needle" ] && return 0
            done
            return 1
          }

          to_add=()
          if [ ${#desired[@]} -gt 0 ]; then
            for label in "${desired[@]}"; do
              contains "$label" "${current[@]:-}" || to_add+=("$label")
            done
          fi

          to_remove=()
          for label in "${managed[@]}"; do
            if contains "$label" "${current[@]:-}" && ! contains "$label" "${desired[@]:-}"; then
              to_remove+=("$label")
            fi
          done

          if [ ${#to_add[@]} -gt 0 ]; then
            add_args=()
            for label in "${to_add[@]}"; do
              add_args+=(-f "labels[]=$label")
            done
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" "${add_args[@]}" >/dev/null
            echo "Added: ${to_add[*]}"
          fi

          # Remove only stale labels owned by this job. Unrelated labels are
          # never submitted as a replacement set, so concurrent additions by
          # maintainers or other automation remain untouched.
          if [ ${#to_remove[@]} -gt 0 ]; then
            for label in "${to_remove[@]}"; do
              if delete_error=$(gh api --silent -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label" 2>&1); then
                continue
              fi

              # A concurrent run or maintainer may have removed the same
              # label after our initial read. Confirm the resulting state so
              # an already-satisfied deletion stays idempotent, but preserve
              # every failure that leaves the label present or unknown.
              if ! labels_after=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' | sort -u); then
                printf '%s\n' "$delete_error" >&2
                echo "::error::Unable to remove $label or confirm its current state."
                exit 1
              fi
              if grep -Fxq "$label" <<< "$labels_after"; then
                printf '%s\n' "$delete_error" >&2
                echo "::error::Unable to remove managed label $label."
                exit 1
              fi
            done
            echo "Removed: ${to_remove[*]}"
          fi

          if [ ${#to_add[@]} -eq 0 ] && [ ${#to_remove[@]} -eq 0 ]; then
            echo "Conventional Commits labels already synchronized."
          fi
