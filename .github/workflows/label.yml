# This workflow handles untrusted pull requests with a write-scoped token.
# Keep these invariants intact:
#   - every checkout, action, and build runs in the read-only classify job;
#   - classify checks out only the immutable base SHA and disables caches;
#   - PR-controlled strings stay in env/files and never enter run expressions;
#   - only a compact JSON array of hardcoded labels crosses into apply;
#   - apply has no checkout/action/build and independently validates its input;
#   - mutations add/remove individual managed labels, never replace the set.

name: label

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify desired labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labels: ${{ steps.classify.outputs.labels }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build trusted validator
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/ccvalidate" ./tools/ccvalidate

      - name: Classify labels
        id: classify
        run: |
          set -euo pipefail

          message_file="$RUNNER_TEMP/pr-message.txt"
          changed_files_file="$RUNNER_TEMP/changed-files.json"

          {
            printf '%s\n' "$PR_TITLE"
            if [ -n "${PR_BODY:-}" ]; then
              printf '\n%s' "$PR_BODY"
            fi
          } >"$message_file"

          gh api --paginate --slurp \
            "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            >"$changed_files_file"

          desired_json=$(".github/scripts/classify-labels.sh" \
            "$RUNNER_TEMP/ccvalidate" \
            "$message_file" \
            "$changed_files_file" \
            "$EXPECTED_CHANGED_FILES")
          printf 'labels=%s\n' "$desired_json" >>"$GITHUB_OUTPUT"

  apply:
    name: apply desired labels
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DESIRED_LABELS_JSON: ${{ needs.classify.outputs.labels }}
    steps:
      - name: Apply labels
        run: |
          set -euo pipefail

          allowed_labels_json='["enhancement","bug","performance","refactor","documentation","test","build","ci","chore","breaking-change","dependencies","parser","tools"]'

          # Treat the job output as an untrusted boundary even though the
          # classifier emits constants. Require a unique array containing
          # only labels owned by this workflow before contacting GitHub.
          if ! desired_json=$(jq -ce -s --argjson allowed "$allowed_labels_json" '
            if length == 1 and
              (.[0] |
                type == "array" and
                length <= ($allowed | length) and
                length == (unique | length) and
                all(.[];
                  . as $label |
                  (($label | type) == "string" and
                  ($allowed | index($label)) != null)
                )
              )
            then .[0]
            else error("invalid classifier output")
            end
          ' <<<"$DESIRED_LABELS_JSON"); then
            echo "::error::Classifier returned invalid labels; refusing to mutate." >&2
            exit 1
          fi

          managed=()
          managed_raw=$(jq -r '.[]' <<<"$allowed_labels_json")
          while IFS= read -r label; do
            [ -n "$label" ] && managed+=("$label")
          done <<<"$managed_raw"

          desired=()
          desired_raw=$(jq -r '.[]' <<<"$desired_json")
          while IFS= read -r label; do
            [ -n "$label" ] && desired+=("$label")
          done <<<"$desired_raw"

          fetch_labels() {
            gh api --paginate --slurp \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels?per_page=100"
          }

          normalize_labels_envelope() {
            jq -ce -s '
              if length == 1 and
                (.[0] |
                  type == "array" and
                  length > 0 and
                  all(.[];
                    type == "array" and
                    all(.[]; type == "object" and (.name | type == "string"))
                  )
                )
              then .[0]
              else error("invalid labels response")
              end
            '
          }

          if ! current_raw=$(fetch_labels); then
            echo "::error::Unable to read current labels; refusing to mutate unknown state." >&2
            exit 1
          fi
          if ! current_json=$(normalize_labels_envelope <<<"$current_raw"); then
            echo "::error::GitHub returned an invalid labels response; refusing to mutate." >&2
            exit 1
          fi

          has_current_label() {
            local label=$1
            jq -e --arg label "$label" 'any(.[][]; .name == $label)' \
              <<<"$current_json" >/dev/null
          }

          has_desired_label() {
            local needle=$1
            local candidate
            for candidate in "${desired[@]:-}"; do
              [ "$candidate" = "$needle" ] && return 0
            done
            return 1
          }

          to_add=()
          for label in "${desired[@]:-}"; do
            [ -n "$label" ] && ! has_current_label "$label" && to_add+=("$label")
          done

          to_remove=()
          for label in "${managed[@]}"; do
            if has_current_label "$label" && ! has_desired_label "$label"; then
              to_remove+=("$label")
            fi
          done

          if [ ${#to_add[@]} -gt 0 ]; then
            add_args=()
            for label in "${to_add[@]}"; do
              add_args+=(-f "labels[]=$label")
            done
            gh api -X POST \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              "${add_args[@]}" >/dev/null
            echo "Added: ${to_add[*]}"
          fi

          if [ ${#to_remove[@]} -gt 0 ]; then
            for label in "${to_remove[@]}"; do
              if delete_error=$(gh api --silent -X DELETE \
                "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label" 2>&1); then
                continue
              fi

              # A concurrent run or maintainer may have removed the same
              # label after the initial read. Confirm the resulting state;
              # preserve failures that leave the label present or unknown.
              if ! current_raw=$(fetch_labels); then
                printf '%s\n' "$delete_error" >&2
                echo "::error::Unable to remove $label or confirm its current state." >&2
                exit 1
              fi
              if ! current_json=$(normalize_labels_envelope <<<"$current_raw") || has_current_label "$label"; then
                printf '%s\n' "$delete_error" >&2
                echo "::error::Unable to remove managed label $label." >&2
                exit 1
              fi
            done
            echo "Removed: ${to_remove[*]}"
          fi

          if [ ${#to_add[@]} -eq 0 ] && [ ${#to_remove[@]} -eq 0 ]; then
            echo "Managed labels already synchronized."
          fi
