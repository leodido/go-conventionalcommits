# Validate PR titles with the repository's Conventional Commits parser.
# This read-only workflow executes the PR merge commit so parser changes are
# tested with the rest of the PR. Maintainers can bypass the check with the
# `no-conventional-title` label.

name: validate-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: validate-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: PR title is Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-conventional-title') }}
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: |
          set -euo pipefail
          if [ ! -d tools/ccvalidate ]; then
            echo "::error::tools/ccvalidate is missing on the PR head; cannot validate the title." >&2
            exit 1
          fi
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr_title.txt"
          CC_INPUT_FILE="$RUNNER_TEMP/pr_title.txt" go run ./tools/ccvalidate
