# Reconcile the repo's labels with .github/labels.yml.
#
# Pull requests get a dry-run; pushes to develop apply the declaration. Labels
# absent from the file are deliberately preserved during migration.

name: labels-bootstrap

on:
  push:
    branches: [develop]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-bootstrap.yml
  pull_request:
    paths:
      - .github/labels.yml
      - .github/workflows/labels-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: labels-bootstrap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reconcile:
    name: reconcile labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Apply labels.yml
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5.3.0
        with:
          yaml-file: .github/labels.yml
          dry-run: ${{ github.event_name == 'pull_request' }}
          skip-delete: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
